<div class="profile-container">
  <div class="profile-header">
    <h1 class="page-title">My Artist Profile</h1>
    <p class="page-subtitle">Update your professional details, contact, location, and casting portfolio experience.</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="state-container">
    <div class="page-spinner"></div>
    <p>Loading profile details...</p>
  </div>

  <!-- Profile Card -->
  <div *ngIf="!loading" class="profile-card">
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="form-grid">
        <!-- Left Side: Image Preview & URL -->
        <div class="avatar-block">
          <div class="avatar-preview">
            <img 
              [src]="f['profileImageUrl'].value || 'https://via.placeholder.com/150?text=Artist+Photo'" 
              alt="Artist Avatar"
              class="avatar-img"
            />
          </div>
          <div class="form-group url-group">
            <label for="profileImageUrl">Profile Image URL</label>
            <input 
              type="text" 
              id="profileImageUrl" 
              formControlName="profileImageUrl" 
              placeholder="https://example.com/avatar.jpg"
              class="form-input"
            />
          </div>
        </div>

        <!-- Right Side: Profile Info -->
        <div class="info-block">
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input 
                type="text" 
                id="phone" 
                formControlName="phone" 
                placeholder="+1 (555) 000-0000"
                class="form-input"
                [ngClass]="{ 'is-invalid': f['phone'].errors }"
              />
              <div *ngIf="f['phone'].errors" class="invalid-feedback">
                Enter a valid phone number format.
              </div>
            </div>

            <div class="form-group">
              <label for="location">Location (City, Country)</label>
              <input 
                type="text" 
                id="location" 
                formControlName="location" 
                placeholder="Chicago, IL"
                class="form-input"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="bio">Biography / About Me</label>
            <textarea 
              id="bio" 
              formControlName="bio" 
              placeholder="Tell casting directors about yourself, your style, training, and acting/musical background..."
              rows="4"
              class="form-textarea"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="experience">Experience / Filmography / Stage Credits</label>
            <textarea 
              id="experience" 
              formControlName="experience" 
              placeholder="List your stage roles, film credits, musical performances, commercials, etc..."
              rows="6"
              class="form-textarea"
            ></textarea>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button type="submit" [disabled]="saving || profileForm.invalid" class="btn-save">
          <span *ngIf="!saving">Save Profile</span>
          <span *ngIf="saving" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
